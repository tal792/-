<title>Ashtal Yourpet רכש</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Fixed bottom tab bar; screens stack vertically; supplier = its own screen with 3 big segments (מחירים / קטלוגים / שיחות). */
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#18282a; --muted:#5f6d6b; --line:#e4dfd4;
  --accent:#0e6f69; --accent-2:#e9f4f2; --accent-ink:#ffffff;
  --tag:#ffcf3d; --tag-ink:#18282a; --ok:#1e8a4c; --wait:#c98a07; --off:#98a19f; --danger:#c2412d;
  --display:'Rubik',system-ui,sans-serif; --body:'Assistant','Rubik',system-ui,sans-serif;
  --tabh:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111918; --card:#1a2423; --ink:#eef3f2; --muted:#a3b0ae; --line:#2b3735;
  --accent:#4cc3b9; --accent-2:#1d302e; --accent-ink:#0b1514;
  --tag:#ffd54f; --tag-ink:#18282a; --ok:#4cd187; --wait:#f0b532; --off:#6f7a78; --danger:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111918; --card:#1a2423; --ink:#eef3f2; --muted:#a3b0ae; --line:#2b3735;
  --accent:#4cc3b9; --accent-2:#1d302e; --accent-ink:#0b1514;
  --tag:#ffd54f; --tag-ink:#18282a; --ok:#4cd187; --wait:#f0b532; --off:#6f7a78; --danger:#ff7a63; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.screen{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:800;font-size:28px;margin:8px 0 2px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:26px 0 10px}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);font-size:15px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
/* bottom tab bar */
.tabs{position:fixed;inset:auto 0 0 0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{flex:1;max-width:140px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;font-size:13px;border-radius:14px;position:relative}
.tabs a .ic{font-size:24px;line-height:1}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-2)}
.badge{position:absolute;top:4px;inset-inline-end:22%;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;display:grid;place-items:center}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-decoration:none;color:inherit;display:block}
.tile b{display:block;font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--muted);font-weight:600}
.tile.ok b{color:var(--ok)}.tile.wait b{color:var(--wait)}.tile.you b{color:var(--accent)}
.alert{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;margin-top:14px}
.alert.hot{border-color:var(--danger)}
.alert .big{font-size:30px}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.list>*{min-width:0}
[hidden]{display:none!important}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.dot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:7px;background:var(--wait)}
/* supplier rows */
.search{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:10px 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none;color:inherit;min-height:84px}
.avatar{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff}
.srow .mid{flex:1;min-width:0}
.srow .mid h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-2);color:var(--accent)}
.st{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px}
.st.replied{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.waiting{background:color-mix(in srgb,var(--wait) 22%,transparent);color:var(--wait)}
.st.lead{background:color-mix(in srgb,var(--off) 22%,transparent);color:var(--muted)}
.chev{font-size:22px;color:var(--muted)}
/* supplier screen */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;text-decoration:none;color:var(--accent);font-family:var(--display);font-weight:700}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:10px}
.hero .top{display:flex;gap:14px;align-items:center}
.hero .avatar{flex-basis:64px;height:64px;font-size:28px;border-radius:20px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 14px;border-radius:14px;text-decoration:none;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:16px;border:0;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:12px;padding:8px 12px;direction:ltr;font-size:15px;overflow-wrap:anywhere}
.copy button{direction:rtl;flex:0 0 auto;border:0;background:var(--accent-2);color:var(--accent);font-weight:700;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.segtabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 0;margin-top:8px}
.segtabs button{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer}
.segtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.segtabs button .muted{color:inherit;opacity:.75}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.wait li::before{content:"⏳ "}
/* products */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.pic .emo{font-size:46px}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.price{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-weight:800;font-size:19px;padding:4px 10px;border-radius:10px;direction:ltr;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.price small{font-size:12px;font-weight:700;opacity:.8}
.pb{padding:10px 12px 12px;display:grid;gap:3px}
.pb h3{font-size:16px}
.pb .s{font-size:13px;color:var(--accent);font-weight:700}
.pb .m{font-size:13px;color:var(--muted)}
.pb .code{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.more{width:100%;margin-top:12px}
.picks{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px}
.picks button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:19px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center}
.picks button[aria-pressed="true"].like{background:#ffe1e6}
.picks button[aria-pressed="true"].no{background:#e8e8e8}
.prod.liked{border-color:#e8577a;box-shadow:0 0 0 2px color-mix(in srgb,#e8577a 30%,transparent)}
.prod.dim{opacity:.55}
.ribbon{position:absolute;top:8px;inset-inline-start:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.howto{background:var(--accent-2);border-radius:16px;padding:12px 14px;font-size:15px;margin-top:10px}
.tabs a{font-size:12px}
/* files */
.frow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit;min-height:68px}
.frow .fi{font-size:28px}
.frow .fn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.frow .fk{font-size:13px;color:var(--muted);font-weight:400}
/* emails */
.mail{display:grid;gap:4px}
.mail .d{font-size:13px;color:var(--muted)}
.notes{white-space:pre-wrap;font-size:15px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.empty .big{font-size:36px;display:block;margin-bottom:6px}
.sort{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.sort select{font:inherit;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){.srow,.prod,.frow,.tile{transition:transform .12s}.srow:active,.prod:active,.frow:active,.tile:active{transform:scale(.98)}}
@media (min-width:900px){.screen{max-width:960px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<main class="screen" id="app" aria-live="polite">
  <div class="empty"><span class="big">🐾</span>טוען את הנתונים…</div>
</main>

<nav class="tabs" aria-label="תפריט ראשי">
  <a href="#home" data-v="home"><span class="ic">🏠</span>בית</a>
  <a href="#suppliers" data-v="suppliers"><span class="ic">🏭</span>ספקים</a>
  <a href="#mine" data-v="mine"><span class="ic">⭐</span>הקטלוג שלי</a>
  <a href="#products" data-v="products"><span class="ic">📚</span>קטלוג</a>
  <a href="#approve" data-v="approve"><span class="ic">✋</span>לאישור<span class="badge" id="nb" hidden></span></a>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const CATEMO={harness:'🦺',collar:'⭕',leash:'🦮',bed:'🛏️',bowl:'🥣',toy:'🧸',pad:'🧻',other:'⭐'};
const CATBG={harness:'#dff1ee',collar:'#fdf0d5',leash:'#e6eefc',bed:'#f3e6f7',bowl:'#e3f4e1',toy:'#fde5e1',pad:'#eceae4',other:'#f1efe8'};
const AV=['#0e6f69','#b2552d','#3d5a99','#7a4e9c','#2f7d3e','#9c6b10','#a33a59'];
const ST={replied:'ענה ✓',waiting:'מחכים לו',lead:'עוד לא פנינו'};
let D=null, ui={sup:'all', q:'', cat:'all', sort:'price', seg:'prices', scat:'all', shown:20, pshown:20, noimg:false, mcat:'all'};
let PICKS={}, canPick=false, dbh=null;
const ALL=()=>D.suppliers.flatMap(s=>((s.dossier||{}).items||[]).map(i=>Object.assign({sup:s.name,sid:s.id},i)));
const pickOf=p=>(PICKS[p.key]&&PICKS[p.key].v)||p.mine||'';
const isMine=p=>pickOf(p)==='like'||(p.rec&&pickOf(p)!=='no');
const imgFirst=(li,flag)=>{const w=li.filter(p=>p.img);return {list:flag?li:w,hidden:li.length-w.length};};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=(a,b)=>a==null?'—':(!b||a===b?`$${a.toFixed(2)}`:`$${a.toFixed(2)}<small> –${b.toFixed(2)}</small>`);
const av=s=>AV[[...s.id].reduce((a,c)=>a+c.charCodeAt(0),0)%AV.length];
const clean=v=>v&&!/not found|not stated|^—$/.test(v)?v:'';
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('הועתק ✓'),()=>toast('סמנו והעתיקו ידנית'))}catch(e){toast('סמנו והעתיקו ידנית')}}
function card(p,showSup){
  const pk=pickOf(p);
  const btns=canPick?`<div class="picks"><button class="like" data-pick="like" data-key="${esc(p.key)}" aria-pressed="${pk==='like'}" aria-label="להוסיף לקטלוג שלי">${pk==='like'?'❤️':'🤍'}</button><button class="no" data-pick="no" data-key="${esc(p.key)}" aria-pressed="${pk==='no'}" aria-label="לא רלוונטי כרגע">✖️</button></div>`:'';
  return `<article class="prod ${pk==='like'?'liked':''} ${pk==='no'?'dim':''}"><div class="pic" style="background:${CATBG[p.cat]||CATBG.other}">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.he)}" loading="lazy">`:`<span class="emo" aria-hidden="true">${CATEMO[p.cat]||'⭐'}</span>`}${p.rec&&pk!=='like'?'<span class="ribbon">✨ מומלץ לך</span>':''}${btns}<div class="price">${money(p.pmin,p.pmax)}</div></div>
  <div class="pb"><h3>${esc(p.he)}</h3>${showSup?`<div class="s">${esc(p.sup)}</div>`:''}<div class="m">מינימום: <b>${esc(p.moq||'—')}</b></div>${p.code?`<div class="code">${esc(p.code)}</div>`:''}</div></article>`;
}
/* ---------- screens ---------- */
function home(){
  const s=D.suppliers, ap=D.approvals||[];
  const replied=s.filter(x=>x.state==='replied'), waiting=s.filter(x=>x.state==='waiting');
  const h=new Date().getHours(); const hi=h<12?'בוקר טוב':h<17?'צהריים טובים':'ערב טוב';
  return `<div class="hello"><div><h1>${hi}, טל 👋</h1><div class="sub">עודכן ${esc(D.updated)} · הצוות עובד בשבילך</div></div></div>
  <a class="alert ${ap.length?'hot':''}" href="#approve"><span class="big">${ap.length?'✋':'✅'}</span><div><h3>${ap.length?ap.length+' דברים מחכים לאישור שלך':'אין שום דבר שמחכה לך'}</h3><div class="sub">${ap.length?'לחצו לראות ולאשר':'הסוכנים יעדכנו כשיהיה'}</div></div></a>
  <div class="tiles">
    <a class="tile ok" href="#suppliers" data-filter="replied"><b>${replied.length}</b><span>ענו</span></a>
    <a class="tile wait" href="#suppliers" data-filter="waiting"><b>${waiting.length}</b><span>מחכים להם</span></a>
    <a class="tile you" href="#products"><b>${s.reduce((a,x)=>a+((x.dossier||{}).products||0),0)}</b><span>מחירים</span></a>
  </div>
  <h2>🔥 הספקים שענו</h2>
  <div class="list">${replied.map(row).join('')||'<div class="empty">עוד אין</div>'}</div>
  <h2>📌 מה קורה עכשיו</h2>
  <ul class="list">${D.todo.map(t=>`<li class="item"><span class="dot"></span><span>${esc(t)}</span></li>`).join('')}</ul>
  <h2>🤖 הצוות שעובד בשבילך</h2>
  <div class="sub" style="margin-bottom:8px">עד עכשיו הצוות חסך לך בערך <b>${(D.team||[]).reduce((a,t)=>a+((t.stats||{}).hours_saved||0),0).toFixed(0)} שעות עבודה</b> (הערכה). לחצו על סוכן לפרטים.</div>
  <div class="list">${(D.team||[]).map(agentRow).join('')}</div>`;
}
function agentRow(t){
  const st=t.stats||{};
  const cls=t.status==='פעיל'?'replied':t.status==='מושבת'?'lead':'waiting';
  return `<a class="srow" href="#a-${esc(t.id)}"><span class="avatar" style="background:var(--accent-2);font-size:26px" aria-hidden="true">${esc(t.emoji||'🤖')}</span>
  <div class="mid"><h3>${esc(t.name)}</h3><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="st ${cls}">${esc(t.status||'')}</span><span class="sub">${esc(t.schedule||'')}</span></div>
  <div class="chips"><span class="chip">⏱️ ${st.hours_saved||0} שעות נחסכו</span><span class="chip">✅ ${st.items||0} פעולות</span></div></div><span class="chev" aria-hidden="true">‹</span></a>`;
}
function agent(id){
  const t=(D.team||[]).find(x=>x.id===id); if(!t) return `<a class="back" href="#home">→ בית</a><div class="empty">הסוכן לא נמצא</div>`;
  const st=t.stats||{}; const tok=st.tokens||0;
  const eff=st.runs?Math.round(100*(st.runs-(st.empty||0)-(st.fail||0))/st.runs):null;
  return `<a class="back" href="#home">→ בית</a>
  <section class="hero"><div class="top"><span class="avatar" style="background:var(--accent-2);font-size:32px" aria-hidden="true">${esc(t.emoji||'🤖')}</span><div style="min-width:0"><h1 style="margin:0">${esc(t.name)}</h1><div class="sub">${esc(t.status||'')} · ${esc(t.schedule||'')}</div></div></div>
  <div>${esc(t.role)}</div></section>
  <h2>📊 כמה הוא שווה לך</h2>
  <div class="tiles">
    <div class="tile ok"><b>${st.hours_saved||0}</b><span>שעות שחסך לך*</span></div>
    <div class="tile you"><b>${st.items||0}</b><span>פעולות שביצע</span></div>
    <div class="tile wait"><b>${eff==null?'—':eff+'%'}</b><span>ריצות עם תוצאה</span></div>
  </div>
  <h2>💸 כמה הוא עולה לך</h2>
  <div class="tiles">
    <div class="tile"><b style="font-size:26px">${tok?(tok/1000).toFixed(0)+'K':'—'}</b><span>טוקנים שצרך${tok?'':' (לא נמדד)'}</span></div>
    <div class="tile"><b>${tok?st.share+'%':'—'}</b><span>מהשימוש של הצוות</span></div>
    <div class="tile"><b>${(st.empty||0)+(st.fail||0)}</b><span>ריצות בלי תוצאה</span></div>
  </div>

function render(){
  if(!D) return;
  const h=(location.hash||'#home').slice(1);
  let v=h, html='';
  if(h.startsWith('s-')){v='suppliers';html=supplier(h.slice(2));}
  else if(h.startsWith('a-')){v='home';html=agent(h.slice(2));}
  else if(h==='suppliers')html=suppliers();
  else if(h==='products')html=products();
  else if(h==='mine')html=mine();
  else if(h==='approve')html=approve();
  else {v='home';html=home();}
  $('app').innerHTML=html;
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const nb=$('nb'),n=(D.approvals||[]).length; nb.hidden=!n; nb.textContent=n;
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#s-')&&location.hash!==lastHash){ui.seg='prices';ui.scat='all';ui.shown=20;}lastHash=location.hash;render();window.scrollTo(0,0)});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sup],[data-seg],[data-scat],[data-cat],[data-more],[data-pmore],[data-copy],[data-filter],[data-pick],[data-noimg],[data-mcat]'); if(!t) return;
  if(t.dataset.copy){copy(t.dataset.copy);return;}
  if(t.dataset.pick){pick(t.dataset.key,t.dataset.pick);return;}
  if(t.dataset.noimg){ui.noimg=true;}
  if(t.dataset.mcat){ui.mcat=t.dataset.mcat;}
  if(t.dataset.filter){ui.sup=t.dataset.filter;return;}
  if(t.dataset.sup) ui.sup=t.dataset.sup;
  if(t.dataset.seg){ui.seg=t.dataset.seg;}
  if(t.dataset.scat){ui.scat=t.dataset.scat;ui.shown=20;}
  if(t.dataset.cat){ui.cat=t.dataset.cat;ui.pshown=20;}
  if(t.dataset.more) ui.shown+=20;

});

async function pick(key,v){
  const cur=(PICKS[key]&&PICKS[key].v)||'';
  const nv=cur===v?'':v;
  PICKS[key]=nv?{v:nv}:{v:'none'}; const y=window.scrollY; render(); window.scrollTo(0,y);
  toast(nv==='like'?'נוסף לקטלוג שלי ❤️':nv==='no'?'סומן: לא רלוונטי כרגע':'הבחירה בוטלה');
  if(!dbh) return;
  try{ await dbh.collection('picks').doc(key).set({v:nv||'none',at:new Date().toISOString()}); }
  catch(e){ toast('לא הצלחתי לשמור. נסו שוב'); }
}
async function initPicks(){
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db) return;
    dbh=db;
    canPick=!!(user&&user.isOwner&&await user.isOwner());
    db.collection('picks').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{const b=d.data(); if(b) m[d.id]=b;}); PICKS=m;
      const y=window.scrollY; render(); window.scrollTo(0,y);
    },()=>{});
    render();
  }catch(e){}
}
if(window.claude&&claude.use) initPicks();

 .catch(()=>{$('app').innerHTML='<div class="empty"><span class="big">😕</span>לא הצלחתי לטעון את הנתונים. נסו לרענן את הדף.</div>'});
